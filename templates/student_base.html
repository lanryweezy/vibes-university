<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vibes University{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b35;
            --primary-light: #ff8c42;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #020617;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 32px;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 48px;
            text-decoration: none;
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .nav-item { margin-bottom: 8px; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 107, 53, 0.1);
            color: var(--primary);
        }

        .logout-link {
            margin-top: auto;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 16px;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            margin-left: 280px;
            padding: 48px;
            max-width: 1200px;
            width: calc(100% - 280px);
        }

        @media (max-width: 1024px) {
            .sidebar { width: 80px; padding: 24px 16px; }
            .logo span, .nav-link span, .logout-link span { display: none; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 32px 20px; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <aside class="sidebar">
        <a href="/" class="logo">V<span>ibes U</span></a>
        <nav class="nav-menu">
            <li class="nav-item">
                <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
                    <i class="fas fa-columns"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('student_content_bp.student_courses') }}" class="nav-link {% if '/courses' in request.path or '/lesson' in request.path %}active{% endif %}">
                    <i class="fas fa-book"></i>
                    <span>My Courses</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('blog_bp.list_blogs') }}" class="nav-link">
                    <i class="fas fa-rss"></i>
                    <span>AI Blog</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/profile" class="nav-link {% if request.path == '/profile' %}active{% endif %}">
                    <i class="fas fa-user"></i>
                    <span>My Profile</span>
                </a>
            </li>
        </nav>
        <a href="/logout" class="logout-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
