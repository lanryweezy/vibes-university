<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Demo Payment | Vibes University</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b35;
            --primary-light: #ff8c42;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .payment-container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h2 { color: var(--primary); font-size: 2rem; margin-bottom: 8px; }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .demo-notice {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }

        .btn-pay {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--primary), var(--primary-light));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s;
        }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3); }
        .btn-pay:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="header">
            <h2>🎯 Demo Enrollment</h2>
            <p>Access the platform instantly for testing.</p>
        </div>

        <div class="demo-notice">
            <i class="fas fa-flask"></i> Testing Mode: Creates a demo enrollment and redirects to dashboard.
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="plan">Select Plan</label>
                <select name="plan" id="plan">
                    <option value="course">Course Access (₦100,000)</option>
                    <option value="online">Online Mentorship (₦400,000)</option>
                    <option value="vip">VIP Physical Class (₦2,000,000)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" required placeholder="John Doe" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="demo@vibesuniversity.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" name="phone" id="phone" required placeholder="+234..." autocomplete="tel">
            </div>

            <button class="btn-pay" type="submit">🚀 Access Student Dashboard</button>
        </form>

        <a href="{{ url_for('main_bp.home') }}" class="back-link">← Return to Homepage</a>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = 'Processing... <i class="fas fa-spinner fa-spin" style="margin-left: 8px;"></i>';
        });
    </script>
</body>
</html>
