<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Vibes - Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #ff6b35; padding: 20px 0; text-align: center; }
        header h1 { color: #ff6b35; margin: 0; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 40px; }
        .blog-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; overflow: hidden; transition: transform 0.3s; }
        .blog-card:hover { transform: translateY(-5px); border-color: #ff6b35; }
        .blog-image { width: 100%; height: 200px; object-fit: cover; }
        .blog-content { padding: 20px; }
        .blog-title { font-size: 1.5rem; color: #ff6b35; margin-bottom: 10px; text-decoration: none; display: block; }
        .blog-meta { font-size: 0.9rem; color: #888; margin-bottom: 15px; }
        .blog-excerpt { font-size: 1rem; color: #ccc; line-height: 1.6; }
        .read-more { display: inline-block; margin-top: 15px; color: #ff6b35; text-decoration: none; font-weight: bold; }
        .back-home { color: #ff6b35; text-decoration: none; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <header>
            <h1>AI & Vibes Blog</h1>
            <p>Insights on AI, Wealth, and the Future</p>
        </header>

        <div class="blog-grid">
            {% for blog in blogs %}
            <div class="blog-card">
                {% if blog.image_url %}
                <img src="{{ blog.image_url }}" alt="{{ blog.title }}" class="blog-image">
                {% else %}
                <div class="blog-image" style="background: #333; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-robot fa-3x" style="color: #555;"></i>
                </div>
                {% endif %}
                <div class="blog-content">
                    <a href="/blog/{{ blog.slug }}" class="blog-title">{{ blog.title }}</a>
                    <div class="blog-meta">By {{ blog.author }} | {{ blog.created_at }}</div>
                    <div class="blog-excerpt">
                        {{ blog.content | striptags | truncate(150) }}
                    </div>
                    <a href="/blog/{{ blog.slug }}" class="read-more">Read More</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
